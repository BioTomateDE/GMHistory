[package]
name = "gmhistory"
version = "0.1.0"
edition = "2024"
authors = ["BioTomateDE <rust@biotomate.dev>"]
license = "GPL-3.0-only"

[lints.rust]
unused_results = "warn"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "allow"
doc_markdown = "allow"
option_if_let_else = "allow"
cast_possible_truncation = "allow"
significant_drop_tightening = "allow"        # this needs more work lol
match_like_matches_macro = "allow"           # ugly ass double indentation
case_sensitive_file_extension_comparisons = "allow"

[profile.full-release]
inherits = "release"
lto = "fat"
codegen-units = 1

[dependencies]
base64 = "0.23.1"
bstr = "1.14.0"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
env_logger = "0.11.11"
indicatif = "0.18.6"
log = "0.4.35"
memmap2 = "0.9.12"
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
strip-ansi-escapes = "0.2.1"
strum = { version = "0.28.0", features = ["derive"] }
system-memory = "0.2.1"
tokio = { version = "1.53.2", features = ["fs", "macros", "process", "rt-multi-thread", "sync"] }
uuid = { version = "1.29.2", features = ["serde"] }
