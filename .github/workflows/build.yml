name: Build

on:
    push:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    - { name: linux-x64, os: ubuntu-latest, dir: target/full-release }
                    - { name: linux-arm64, os: ubuntu-24.04-arm, dir: target/full-release }
                    - { name: macos-arm64, os: macos-latest, dir: target/full-release }
                    - { name: windows-x64, os: ubuntu-latest, target: x86_64-pc-windows-gnu, dir: target/x86_64-pc-windows-gnu/full-release, ext: .exe }
        steps:
            - uses: actions/checkout@v6
            - name: Add Rust target
              if: matrix.target
              run: rustup target add ${{ matrix.target }} && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
            - uses: Swatinem/rust-cache@v2
            - run: cargo build --locked --profile=full-release ${{ matrix.target && format('--target={0}', matrix.target) || '' }}
            - name: Stage binary
              run: |
                  mkdir dist && cp "${{ matrix.dir }}/gmhistory${{ matrix.ext }}" dist/
            - uses: actions/upload-artifact@v7
              with:
                  name: gmhistory-${{ matrix.name }}
                  path: |
                      dist/*
                  if-no-files-found: error
                  retention-days: 7
